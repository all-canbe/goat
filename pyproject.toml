[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "goat"
version = "0.1.0"
description = "Goat — 山羊主题 Agent 工具，子 Agent 并行调度 + 多模式审批 + 对话管理"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0.0",
    "langchain>=1.3.0,<2.0.0",
    "langchain-core>=1.4.0,<2.0.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.1.0",
    "langgraph>=1.2.0,<1.3.0",
    "pydantic>=2.0.0",
    "mcp>=1.10.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
goat = "main:main"
goat_tui = "tui_main:main"

[tool.setuptools.packages.find]
include = ["goat*"]

[tool.setuptools]
py-modules = ["main", "tui_main"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]